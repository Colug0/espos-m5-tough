# Adapted from dirkwa/espos-bathy-bridge (Apache-2.0): the same build, warning
# gate and UI check, for the Tough's classic ESP32.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A run takes minutes. One run per ref, superseded ones cancelled; main keys
# on the commit so a merge's own run is never cancelled by the next push.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp32]
    steps:
      # fetch-depth: 0 because the version baked into the image comes from
      # `git describe`; with the default depth of 1 there are no tags, and
      # every build between two releases would claim to BE the last release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: read pinned IDF version
        id: idf
        run: echo "version=$(cat .idf-version)" >> "$GITHUB_OUTPUT"

      # Anonymous Docker Hub pulls are capped per runner IP. Without the
      # variable, or when the login fails, the pull is anonymous as before.
      - name: log in to Docker Hub
        if: vars.DOCKERHUB_USERNAME != ''
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # No signing key here: CMake generates a throwaway one, which is right
      # for images that are never released. Pull requests never see the key.
      - uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: ${{ steps.idf.outputs.version }}
          target: ${{ matrix.target }}
          # pipefail, or tee's exit status would hide a failed build.
          command: set -o pipefail; idf.py build 2>&1 | tee build.log

      # Zero warnings is the gate (AGENTS.md), and idf.py build succeeds with
      # compiler, linker and CMake warnings alike. CMake wraps its text over
      # several lines, so each CMake warning is read with the lines that follow
      # it. Three are expected:
      # - the development signing key CI builds with;
      # - the component manager's "re-run" pair on every configure. LVGL's
      #   registry manifest makes optional dependencies conditional on Kconfig
      #   options (LV_USE_FREETYPE, ...) that do not exist when LVGL is set up
      #   through lv_conf.h, so the manager asks for a second pass (an empty
      #   warning from build.cmake) and then reports the missing option.
      - name: fail on build warnings
        run: |
          set -euo pipefail
          found=$(sed 's/\x1b\[[0-9;]*[mK]//g' build.log | awk '
            pending {
              text = text " " $0
              if (++n == 3) {
                gsub(/[ \t]+/, " ", text)
                if (text !~ /generating a development RSA-3072 signing key/ &&
                    text !~ /tools\/cmake\/build\.cmake:[0-9]+ \(message\): Call Stack/ &&
                    text !~ /Missing kconfig option\. Re-run the build process/) print text
                pending = 0
              }
              next
            }
            /CMake Warning/ { pending = 1; text = $0; n = 0; next }
            /warning:/ { print }
            END { if (pending) print text }
          ')
          if [ -n "$found" ]; then
            printf '%s\n' "$found"
            echo "::error::the ${{ matrix.target }} build has warnings"
            exit 1
          fi
          echo "no build warnings"

      # The espOS web UI is a committed bundle; this checks it was packed into
      # the LittleFS image rather than left out silently.
      - name: check the UI made it into the image
        run: test -s build/storage.bin
