## espOS-related components come from the espos/ submodule, which pins its own
## registry dependencies (cJSON, mDNS, LittleFS); a copy here could only
## disagree with them. LVGL is the HAL's (components/tough_hal).
dependencies:
  idf: ">=6.0.0"
  bblanchon/arduinojson: "^7.4.0"
  espressif/esp_new_jpeg: "^1.0.0"
