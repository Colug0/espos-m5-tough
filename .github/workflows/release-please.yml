# Adapted from dirkwa/espos-bathy-bridge (Apache-2.0), with the build and
# signing done by espOS's reusable release-firmware.yml.
#
# Cuts releases from the history, the way espOS does: a push to main that
# carries a change users get (the gate below) refreshes a "chore: release
# x.y.z" pull request carrying the changelog and the version.txt bump, and
# merging that PR tags and publishes the release. feat bumps minor, fix bumps
# patch, a `!` bumps major. The changelog is the release notes GitHub
# generates for the merged pull requests, each with its author and a link to
# it, sorted by the labels label-by-title.yml sets (.github/release.yml).
#
# A release created here is created with the workflow's own token, and
# GitHub never lets such an event start another workflow, so the firmware
# build, signing and asset upload are called directly from this workflow.
name: release-please

on:
  push:
    branches: [main]
  # A change to the release configuration is a ci merge, which the gate stops,
  # so a manual run is what rewrites the open release PR against it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # GitHub's release notes are never empty (they end in a "Full Changelog"
  # link), so release-please, which skips a release only when its notes are
  # empty, would propose one after every merge, docs and ci included. Only a
  # push carrying a change users get goes on: feat, fix, perf, refactor or
  # revert, a breaking change whatever its type, a `Release-As:` footer, and
  # the merge of the release PR itself, which is what creates the tag. The
  # payload holds at most 2048 commits, so a push that fills it may hide more
  # and is let through.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      releasable: ${{ steps.check.outputs.releasable }}
    steps:
      # A manual run carries no commits of its own, so it judges every commit
      # since the last release instead. With no tag for the manifest's version
      # (the first release, or a merged release PR never tagged) it goes on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        env:
          DISPATCHED: ${{ github.event_name == 'workflow_dispatch' }}
          MESSAGES: ${{ toJSON(github.event.commits.*.message) }}
          RELEASABLE: '^((feat|fix|perf|refactor|revert)(\([^)]*\))?!?: |[a-z]+(\([^)]*\))?!: |Revert |chore: release v?[0-9])'
        run: |
          if [ "$DISPATCHED" = true ]; then
            last="v$(jq -er '."."' .release-please-manifest.json)"
            if ! git rev-parse -q --verify "refs/tags/$last" > /dev/null; then
              echo "releasable=true" >> "$GITHUB_OUTPUT"
              echo "No tag $last; release-please not gated."
              exit 0
            fi
            MESSAGES=$(git log -z --format=%B "$last..HEAD" | jq -Rs 'split("\u0000") | map(select(. != ""))')
            echo "Judging the $(jq length <<< "$MESSAGES") commits since $last."
          fi
          if jq -e --arg re "$RELEASABLE" '(length >= 2048) or ([.[] | (split("\n")[0] | test($re)) or test("\nBREAKING[- ]CHANGE: ") or test("\nRelease-As: ")] | any)' <<< "$MESSAGES" > /dev/null; then
            echo "releasable=true" >> "$GITHUB_OUTPUT"
          else
            echo "releasable=false" >> "$GITHUB_OUTPUT"
            echo "No releasable commit; release-please not run."
          fi

  release-please:
    needs: gate
    if: needs.gate.outputs.releasable == 'true'
    # One at a time: a push and a manual run could both find the merged
    # release PR untagged and both try to create its release.
    concurrency:
      group: release-please
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Builds the image once, signs it with SIGNING_KEY_PEM, attaches
  # m5-tough-esp32-vX.Y.Z-{merged,ota}.bin to the release and mirrors them to
  # the release-assets branch, where the browser flasher can read them. No
  # flash_tables: the Tough always has 16 MB, and partitions-16mb.csv (the
  # project's table, with the layout partition) is what the image is laid out
  # for. Pinned by commit like every other action here, because this
  # workflow receives the signing key; the comment names the release.
  # Keep it on the same espOS release as the espos submodule: Dependabot
  # moves the pin, track-espos.yml moves the submodule.
  firmware:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: signalk-espOS/espOS/.github/workflows/release-firmware.yml@04e2c458441440747276328ea7df5e2aa8e451c3 # v0.26.0
    with:
      name: m5-tough
      builds: '[{"target": "esp32"}]'
      tag: ${{ needs.release-please.outputs.tag_name }}
      # The merged image must carry the web UI.
      require: storage
    secrets:
      # A repository secret is not visible inside a called workflow unless it
      # is passed. Without it the workflow refuses to build a release (unless
      # ESPOS_ALLOW_UNSIGNED_RELEASE is set), rather than shipping one that
      # installs over USB and then refuses every OTA.
      signing_key: ${{ secrets.SIGNING_KEY_PEM }}
      dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
